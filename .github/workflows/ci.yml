name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/product?schema=public"
  AUTH_SECRET: "ci-only-secret"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: product
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/vuln-lab is a local-only, intentionally-vulnerable pentest lab (see
      # apps/vuln-lab/CLAUDE.md) that must never run in CI. It has no build/start/test:e2e
      # scripts, so `pnpm build`/`pnpm test:e2e` below already skip it automatically via
      # Turborepo. `check`/`typecheck`/`test` do cover it locally (see root CLAUDE.md /
      # Acceptance criteria), so here we exclude it explicitly instead — via each command's
      # own CLI args, never via biome.json's global ignore list.
      - name: Lint & format check
        run: >-
          pnpm exec biome check
          apps/web packages scripts docs .github
          package.json pnpm-workspace.yaml pnpm-lock.yaml turbo.json tsconfig.base.json
          biome.json README.md CLAUDE.md RUNBOOK.md .nvmrc .dockerignore .gitignore

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=!vuln-lab

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Unit tests
        run: pnpm exec turbo run test --filter=!vuln-lab

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
